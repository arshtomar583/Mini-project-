name: Project checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: python -m unittest discover -s tests -v
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  container:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t explain-codebase:check .
      - name: Validate EC2 service configuration
        run: docker compose -f deploy/aws/compose.yaml config --quiet
      - name: Validate HTTPS proxy configuration
        run: >-
          docker run --rm -e APP_DOMAIN=localhost
          -v "$PWD/deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Start bounded production container
        run: >-
          docker run -d --name codebase-check -p 127.0.0.1:10000:10000
          --memory=512m --cpus=1 --pids-limit=64 --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=64m
          --cap-drop=ALL --security-opt=no-new-privileges
          explain-codebase:check
      - name: Check website, ZIP analysis, and API errors
        run: python scripts/smoke_deployment.py http://127.0.0.1:10000 --wait-seconds 30
      - name: Show container logs
        if: always()
        run: docker logs codebase-check
      - name: Expose failed container diagnostics in check annotations
        if: failure()
        shell: python
        run: |
          import subprocess
          result = subprocess.run(['docker', 'logs', '--tail', '50', 'codebase-check'], capture_output=True, text=True)
          message = (result.stdout + result.stderr).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Container failure details::{message}')
      - name: Stop test container
        if: always()
        run: docker rm -f codebase-check
